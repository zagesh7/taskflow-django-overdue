kind: wasmer.io/App.v0
owner: zagesh7
name: taskflow-django-overdue
package: .
jobs:
  - name: overdue-sweep
    trigger: post-deployment
    action:
      execute:
        command: python
        cli_args:
          - /app/manage.py
          - mark_overdue_tasks
        env:
          PYTHONPATH: /app
